{% extends "base.html" %}
{% block title %}Log In — HomeFinder{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-card">
    <h1>Welcome Back</h1>
    <p class="auth-sub">Log in to access your saved properties and account.</p>
    <form method="post">
      <div class="form-row">
        <label>Email Address</label>
        <input type="email" name="email" required autofocus placeholder="you@example.com"/>
      </div>
      <div class="form-row">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••"/>
      </div>
      <button type="submit" class="btn-primary full-width">Log In</button>
    </form>
    <p class="auth-switch">Don't have an account? <a href="{{ url_for('register') }}">Register free</a></p>
  </div>
</div>
{% endblock %}
