<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - HomeFinder</title>
  <link rel="stylesheet" href="/client/properties.css">
  <link rel="stylesheet" href="/client/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="header">
    <div class="left-header" onclick="window.location.href='/properties'">Homefinder Portal🏠🌀</div>
    <div class="right-header">
      <button class="sign-up-button" onclick="window.location.href='/register'">Sign Up</button>
    </div>
  </div>

  <div class="auth-container">
    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-subtitle">Log in to your HomeFinder account</p>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <button class="auth-button" onclick="login()">Login</button>

    <p id="message" class="auth-msg"></p>

    <p class="auth-switch">Don't have an account? <a href="/register">Sign up</a></p>
  </div>

  <script src="/client/script.js"></script>
</body>
</html>
