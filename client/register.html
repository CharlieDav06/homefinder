<!DOCTYPE html>
<html>
<head>
    <title>Register - HomeFinder</title>
</head>
<body>

<h2>Register</h2>

<input id="last_name" placeholder="Last Name">
<input id="phone_number" placeholder="Phone Number">

<script src="/client/script.js"></script>
</body>
</html>
