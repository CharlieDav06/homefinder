<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - HomeFinder</title>
  <link rel="stylesheet" href="/client/properties.css">
  <link rel="stylesheet" href="/client/login.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

  <div class="header">
    <div class="left-header" onclick="window.location.href='/properties'">Homefinder Portal🏠🌀</div>
    <div class="right-header">
      <button class="log-in-button" onclick="window.location.href='/login'">Login</button>
    </div>
  </div>

  <div class="auth-container">
    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Join HomeFinder and start exploring properties</p>

    <div class="form-group">
      <label>First Name</label>
      <input type="text" id="first_name" placeholder="e.g. John">
    </div>

    <div class="form-group">
      <label>Last Name</label>
      <input type="text" id="last_name" placeholder="e.g. Smith">
    </div>

    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" id="phone_number" placeholder="e.g. 07700 900000">
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com">
    </div>

    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>

    <div class="form-group gdpr-group">
      <label class="gdpr-label">
        <input type="checkbox" id="gdpr_consent_given">
        I consent to HomeFinder storing my details in line with GDPR.
      </label>
    </div>

    <button class="auth-button" id="registerBtn">Create Account</button>

    <p id="msg" class="auth-msg"></p>

    <p class="auth-switch">Already have an account? <a href="/login">Login</a></p>
  </div>

  <script src="/client/script.js"></script>
</body>
</html>
