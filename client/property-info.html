<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="property-info.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class = "header">
    <div class = "left-header" onclick="window.location.href='/properties'" style="cursor:pointer;">Homefinder Portal🏠🌀</div>
    <div class = "right-header">
      <button class = "sign-up-button" onclick = "window.location.href='/register'">sign up</button>
      <button class = "log-in-button"  onclick = "window.location.href='/login'">Login</button>
    </div>

  </div>

  <div class = "property-container">
    <div class = "image-container">
      <img class = "property-image" id="image">
    </div>
    <div class = "right-property">
      <p class = "property-price" id="price"></p>
      <p class = "property-location" id="location"></p>
      <p class = "property-rooms" id="rooms"></p>
      <p class = "property-description" id="description"></p>
      <ul id="property-details">
        <li>Furnished</li>
      </ul>
      <div class = "button-container">
        <button class = "book-button">Book a viewing</button>
        <button class = "contact-button">Contact Owner</button>
      </div>
    </div>
  </div>





  <div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h2 class = "modal-title">Book a Viewing</h2>
      <button class="modal-close" id="modal-close">✕</button>
    </div>

    <div class="modal-body">
      <div class = "modal-grid">
        <div>
          <label>Reservation Name<br></label> 
          <input class = "input-box" type="text" id="reservation-name" placeholder="Saturday Morning Viewing">
        </div>

        <div>
          <label>Date & Time</label>
          <input class = "input-box" type="datetime-local" id="schedule-date">
        </div>




        <div>
          <label>Duration (minutes)</label>
          <select class = "input-box" id="reservation-duration">
          <option value="30">30 minutes</option>
          <option value="60">1 hour</option>
          <option value="90">1.5 hours</option>
          <option value="120">2 hours</option>
          </select>
        </div>



        <div>
          <label>Viewing Type</label>
          <select class = "input-box" id="reservation-type">
          <option value="in-person">In Person</option>
          <option value="virtual">Virtual</option>
          </select>
        </div>


        
        
      </div>
      




      
    </div>

    <div class="modal-footer">
      <button class="modal-cancel" id="modal-cancel">Cancel</button>
      <button class="modal-submit" id="modal-submit">Confirm Booking</button>
    </div>
  </div>
</div>



  <script src="property-info.js"></script>
  
</body>
</html>
